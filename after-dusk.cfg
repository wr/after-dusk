# The resident program loads at $6000, above both hi-res pages. Effects are
# linked into one file, FX (build/fx.bin), that HELLO loads at $2000 and
# After Dusk keeps in aux memory; each runs in the overlay slot at $8800,
# which ends where DOS 3.3 starts ($9600). The copy loop that fetches an
# effect from aux runs from language-card RAM at $F600. The linker refuses
# anything that outgrows its area.
MEMORY {
    MAIN:   start = $6000, size = $2800, file = %O;
    FXFILE: start = $2000, size = $4000, file = "build/fx.bin";
    LC:     start = $F600, size = $0100, file = "";
    OVL0:   start = $8800, size = $0E00, file = "";
    OVL1:   start = $8800, size = $0E00, file = "";
    OVL2:   start = $8800, size = $0E00, file = "";
    OVL3:   start = $8800, size = $0E00, file = "";
    OVL4:   start = $8800, size = $0E00, file = "";
    OVL5:   start = $8800, size = $0E00, file = "";
    OVL6:   start = $8800, size = $0E00, file = "";
    OVL7:   start = $8800, size = $0E00, file = "";
    OVL8:   start = $8800, size = $0E00, file = "";
    OVL9:   start = $8800, size = $0E00, file = "";
    OVL10:  start = $8800, size = $0E00, file = "";
    OVL11:  start = $8800, size = $0E00, file = "";
    OVL12:  start = $8800, size = $0E00, file = "";
    OVL13:  start = $8800, size = $0E00, file = "";
}
SEGMENTS {
    CODE:   load = MAIN, type = rw;
    LCCODE: load = MAIN, run = LC, type = rw, define = yes;
    FX0:    load = FXFILE, run = OVL0, type = rw, define = yes;
    FX1:    load = FXFILE, run = OVL1, type = rw, define = yes;
    FX2:    load = FXFILE, run = OVL2, type = rw, define = yes;
    FX3:    load = FXFILE, run = OVL3, type = rw, define = yes;
    FX4:    load = FXFILE, run = OVL4, type = rw, define = yes;
    FX5:    load = FXFILE, run = OVL5, type = rw, define = yes;
    FX6:    load = FXFILE, run = OVL6, type = rw, define = yes;
    FX7:    load = FXFILE, run = OVL7, type = rw, define = yes;
    FX8:    load = FXFILE, run = OVL8, type = rw, define = yes;
    FX9:    load = FXFILE, run = OVL9, type = rw, define = yes;
    FX10:   load = FXFILE, run = OVL10, type = rw, define = yes;
    FX11:   load = FXFILE, run = OVL11, type = rw, define = yes;
    FX12:   load = FXFILE, run = OVL12, type = rw, define = yes;
    FX13:   load = FXFILE, run = OVL13, type = rw, define = yes;
}
