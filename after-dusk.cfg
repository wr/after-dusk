# The resident program loads at $6000, above both hi-res pages. Effects are
# linked into three files: FX (build/fx.bin, effects 0-13, kept in aux
# $2000-$5FFF), FX2 (build/fx2.bin, effect 14, kept in aux $6000-$9FFF) and FX3
# (build/fx3.bin, effects 15 on, kept in main $A000-$BFFF once DOS is finished
# with). HELLO loads each at $4000 in turn, and hands it to its stash routine
# (src/splash.s) to put away. FX2 and FX3 are linked at their
# homes, so their load addresses are those addresses. Each
# effect runs in the overlay slot at $8800, which ends where DOS 3.3 starts
# ($9600). Fish!'s art and floor ride in FX2 behind its code and stay in aux,
# where its drawing code reads them; the code that doesn't fit the overlay is
# copied to FXRAM (FISHCODE2) and, for the part that reads aux memory, to the
# language card (FISHLC) when it starts. The copy loops that read aux run from
# language-card RAM at $F600. The linker refuses anything that outgrows its
# area.
MEMORY {
    MAIN:   start = $6000, size = $2800, file = %O;
    FXFILE: start = $2000, size = $4000, file = "build/fx.bin";
    FXFILE2: start = $6000, size = $4000, file = "build/fx2.bin";
    FXFILE3: start = $A000, size = $2000, file = "build/fx3.bin";
    SPLASH: start = $0B00, size = $1300, file = "build/splash.bin";
    PAINTMEM: start = $8000, size = $15E0, file = "build/paint.bin";
    LC:     start = $F600, size = $0100, file = "";
    OVL0:   start = $8800, size = $0E00, file = "";
    OVL1:   start = $8800, size = $0E00, file = "";
    OVL2:   start = $8800, size = $0E00, file = "";
    OVL3:   start = $8800, size = $0E00, file = "";
    OVL4:   start = $8800, size = $0E00, file = "";
    OVL5:   start = $8800, size = $0E00, file = "";
    OVL6:   start = $8800, size = $0E00, file = "";
    OVL7:   start = $8800, size = $0E00, file = "";
    OVL8:   start = $8800, size = $0E00, file = "";
    OVL9:   start = $8800, size = $0E00, file = "";
    OVL10:  start = $8800, size = $0E00, file = "";
    OVL11:  start = $8800, size = $0E00, file = "";
    OVL12:  start = $8800, size = $0E00, file = "";
    OVL13:  start = $8800, size = $0E00, file = "";
    OVL14:  start = $8800, size = $0E00, file = "";
    OVL15:  start = $8800, size = $0E00, file = "";
    OVL16:  start = $8800, size = $0E00, file = "";
    OVL17:  start = $8800, size = $0E00, file = "";
    FISHCODE2MEM: start = $0E00, size = $0E00, file = "";
    FISHLCMEM: start = $F700, size = $08FA, file = "";
}
SEGMENTS {
    SPLASH: load = SPLASH, type = rw;
    PAINT:  load = PAINTMEM, type = rw;
    CODE:   load = MAIN, type = rw;
    ONCE:   load = MAIN, type = rw;
    FXTABLE: load = MAIN, type = rw;
    LCCODE: load = MAIN, run = LC, type = rw, define = yes;
    FX0:    load = FXFILE, run = OVL0, type = rw, define = yes;
    FX1:    load = FXFILE, run = OVL1, type = rw, define = yes;
    FX2:    load = FXFILE, run = OVL2, type = rw, define = yes;
    FX3:    load = FXFILE, run = OVL3, type = rw, define = yes;
    FX4:    load = FXFILE, run = OVL4, type = rw, define = yes;
    FX5:    load = FXFILE, run = OVL5, type = rw, define = yes;
    FX6:    load = FXFILE, run = OVL6, type = rw, define = yes;
    FX7:    load = FXFILE, run = OVL7, type = rw, define = yes;
    FX8:    load = FXFILE, run = OVL8, type = rw, define = yes;
    FX9:    load = FXFILE, run = OVL9, type = rw, define = yes;
    FX10:   load = FXFILE, run = OVL10, type = rw, define = yes;
    FX11:   load = FXFILE, run = OVL11, type = rw, define = yes;
    FX12:   load = FXFILE, run = OVL12, type = rw, define = yes;
    FX13:   load = FXFILE, run = OVL13, type = rw, define = yes;
    FX14:   load = FXFILE2, run = OVL14, type = rw, define = yes;
    FISHART:   load = FXFILE2, type = rw, define = yes;
    FISHFLOOR: load = FXFILE2, type = rw, define = yes;
    FISHCODE2: load = FXFILE2, run = FISHCODE2MEM, type = rw, define = yes;
    FISHLC:    load = FXFILE2, run = FISHLCMEM, type = rw, define = yes;
    FX15:   load = FXFILE3, run = OVL15, type = rw, define = yes;
    FX16:   load = FXFILE3, run = OVL16, type = rw, define = yes;
    FX17:   load = FXFILE3, run = OVL17, type = rw, define = yes;
}
